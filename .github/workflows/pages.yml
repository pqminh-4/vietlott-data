name: Publish static API

on:
  schedule:
    # UTC+7: start 15 minutes after the 13:00, 18:00, and 21:00 draws,
    # then retry every 15 minutes for eight runs through draw time +120.
    # GitHub cron is kept in UTC explicitly: 06/11/14 UTC are the draw hours.
    - cron: "15,30,45 6,11,14 * * *"
    - cron: "0,15,30,45 7,12,15 * * *"
    - cron: "0 8,13,16 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: vietlott-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: vietlott validate
      - run: vietlott build-api
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Verify production freshness
        run: >-
          vietlott check-freshness
          --games all
          --max-delay-minutes 60
          --api-base-url https://pqminh-4.github.io/vietlott-data/api/v1
