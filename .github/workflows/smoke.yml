name: Official source smoke test

on:
  schedule:
    - cron: "43 5 * * *"
      timezone: Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-source:
    runs-on: ubuntu-latest
    env:
      VIETLOTT_RELAY_URL: ${{ secrets.VIETLOTT_RELAY_URL }}
      VIETLOTT_RELAY_TOKEN: ${{ secrets.VIETLOTT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Verify relay configuration
        shell: bash
        run: |
          if [ -z "$VIETLOTT_RELAY_URL" ] || [ -z "$VIETLOTT_RELAY_TOKEN" ]; then
            echo "Cloudflare relay secrets are not configured" >&2
            exit 1
          fi
      - name: Fetch, parse, and validate without writing
        run: vietlott collect --games all --latest --dry-run
