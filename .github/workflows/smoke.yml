name: Official source smoke test

on:
  schedule:
    - cron: "43 5 * * *"
      timezone: Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-source:
    # Keep the smoke test on the same egress pool as the production collector.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Fetch, parse, and validate without writing
        run: vietlott collect --games all --latest --dry-run
