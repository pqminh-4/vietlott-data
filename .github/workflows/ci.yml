name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: Validate tracked data
        run: vietlott validate
      - name: Verify deterministic API build
        shell: bash
        run: |
          vietlott build-api
          first="$(find site/api -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          vietlott build-api
          second="$(find site/api -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          test "$first" = "$second"

