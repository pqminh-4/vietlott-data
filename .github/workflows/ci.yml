name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: Install Worker dependencies
        run: npm ci
      - name: Check Cloudflare Worker
        run: |
          npm run worker:types
          git diff --exit-code -- workers/fetcher/worker-configuration.d.ts workers/relay/worker-configuration.d.ts
          npm run worker:check
          npm run worker:test
          npx wrangler deploy --config workers/fetcher/wrangler.jsonc --dry-run
          npx wrangler deploy --config workers/relay/wrangler.jsonc --dry-run
      - name: Validate tracked data
        run: vietlott validate
      - name: Verify deterministic API build
        shell: bash
        run: |
          vietlott build-api
          first="$(find site/api -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          vietlott build-api
          second="$(find site/api -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          test "$first" = "$second"
