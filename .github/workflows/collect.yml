name: Collect and publish Vietlott data

on:
  schedule:
    - cron: "7,22,37,52 13,18,21 * * *"
      timezone: Asia/Ho_Chi_Minh
    - cron: "17 2 * * *"
      timezone: Asia/Ho_Chi_Minh
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to run
        required: true
        default: scheduled
        type: choice
        options: [scheduled, collect, reconcile, backfill]
      game:
        description: all or a comma-separated game list
        required: true
        default: all
        type: string
      max_draws:
        description: Maximum historical draws per game and run
        required: true
        default: "250"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vietlott-data-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install .
      - name: Collect and validate
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_GAME: ${{ inputs.game }}
          INPUT_MAX_DRAWS: ${{ inputs.max_draws }}
        run: |
          mode="${INPUT_MODE:-scheduled}"
          game="${INPUT_GAME:-all}"
          max_draws="${INPUT_MAX_DRAWS:-250}"
          case "$mode" in
            scheduled) vietlott scheduled ;;
            collect) vietlott collect --games "$game" --latest --audit-pdf ;;
            reconcile) vietlott reconcile --games "$game" --max-backfill-draws "$max_draws" ;;
            backfill) vietlott backfill --game "$game" --resume --max-draws "$max_draws" --audit-pdf ;;
            *) echo "Unsupported mode: $mode" >&2; exit 2 ;;
          esac
          vietlott validate
          vietlott build-api
      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- data site)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git commit -m "data: update Vietlott results $(TZ=Asia/Ho_Chi_Minh date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Configure GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: needs.collect.outputs.changed == 'true'
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
